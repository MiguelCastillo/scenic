<html>
  <head>
    <title>Arcade</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700&family=Russo+One&display=swap"
    />
    <link rel="stylesheet" href="arcade.css" />
    <script type="text/javascript" src="dist/arcade.js" defer></script>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="fps"></div>
    <div id="hud"></div>
    <div id="menu"></div>
    <div id="countdown"></div>
    <div id="message">Loading…</div>
    <div id="room" hidden>
      <span id="room-status"></span>
      <button id="room-connect" hidden>Connect</button>
    </div>
    <button id="pause" hidden aria-label="Pause">❚❚</button>
  </body>
</html>
